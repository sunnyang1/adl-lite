name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # --- Build sdist + wheel ---
  build-python:
    runs-on: ubuntu-latest
    outputs:
      wheel-name: ${{ steps.build.outputs.wheel }}
      sdist-name: ${{ steps.build.outputs.sdist }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        id: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          WHEEL=$(ls dist/*.whl)
          SDIST=$(ls dist/*.tar.gz)
          echo "wheel=${WHEEL##*/}" >> "$GITHUB_OUTPUT"
          echo "sdist=${SDIST##*/}" >> "$GITHUB_OUTPUT"
      - name: Upload sdist + wheel (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # --- PyInstaller standalone executables ---
  build-binary:
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: adl-lite-linux-x86_64
            binary: dist/adl-lite
          - os: macos-latest
            target: macos
            artifact-name: adl-lite-macos-x86_64
            binary: dist/adl-lite
          - os: windows-latest
            target: windows
            artifact-name: adl-lite-windows-x86_64
            binary: dist/adl-lite.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller>=6.0
          pip install -e .

      - name: Build standalone executable (PyInstaller)
        run: |
          pyinstaller \
            --onefile \
            --name adl-lite \
            --add-data "adl_lite/adl_core_ontology.yaml:adl_lite" \
            --hidden-import pydantic \
            --hidden-import pydantic.deprecated.decorator \
            --hidden-import yaml \
            --collect-all adl_lite \
            adl_lite/cli.py

      - name: Verify binary runs
        run: |
          chmod +x dist/adl-lite* 2>/dev/null || true
          ./${{ matrix.binary }} --version || true

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd dist
          BIN=$(ls adl-lite* | head -1)
          sha256sum "$BIN" > "${BIN}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/adl-lite*
            dist/adl-lite*.sha256

  # --- Create GitHub Release ---
  create-release:
    needs: [build-python, build-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release assets
        run: |
          mkdir -p release-assets
          # Copy all files into a flat directory for the release
          find release-artifacts -type f -not -name '*.sha256' | while read f; do
            cp "$f" release-assets/
          done
          # Copy checksum files
          find release-artifacts -type f -name '*.sha256' | while read f; do
            cp "$f" release-assets/
          done
          # Also include the Python wheel + sdist built by build-python
          find release-artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) | while read f; do
            cp "$f" release-assets/
          done
          # Generate a master checksums file
          cd release-assets
          sha256sum * > SHA256SUMS
          ls -la

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          python scripts/extract_release_notes.py "${VERSION}" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ADL Lite ${{ steps.changelog.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
